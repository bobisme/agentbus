[package]
name = "agentbus"
version = "0.1.0"
edition = "2021"
description = "Observe coding agents, publish normalised events and a state snapshot"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agentbus"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 2

[dev-dependencies]
proptest = "1.11.0"
